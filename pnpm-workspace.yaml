packages:
    - 'apps/*'
    - 'packages/*'

allowBuilds:
    '@parcel/watcher': false
    esbuild: true
    msw: true
    unrs-resolver: true

catalog:
    '@shadcn/lint': ^0.2.0
    '@tailwindcss/vite': ^4.3.0
    oxfmt: ^0.63.0
    oxlint: ^1.86.0
    oxlint-tsgolint: ^7.0.2003
    react: ^19.2.6
    react-dom: ^19.2.6
    tailwindcss: ^4.3.0
    typescript: ^7.0.2
    vite: ^8.1.0

catalogs:
    tanstack:
        '@tanstack/devtools-vite': ^0.8.5
        '@tanstack/eslint-config': ^0.4.0
        '@tanstack/eslint-plugin-query': ^5.101.2
        '@tanstack/react-devtools': ^0.10.5
        '@tanstack/react-form': ^1.33.0
        '@tanstack/react-query': ^5.104.0
        '@tanstack/react-router': ^1.170.41
        '@tanstack/react-router-devtools': ^1.167.0
        '@tanstack/react-router-ssr-query': ^1.167.1
        '@tanstack/react-start': ^1.168.60
        '@tanstack/router-plugin': ^1.168.13

minimumReleaseAgeExclude:
  - keycloakify@11.16.1

# Security floor (CVE-2026-102989 / GHSA-qx66-fv34-fjm8, TanStack Start server-function XSS):
# forces every copy in the workspace past the patched versions — including the one pnpm
# auto-installs as oidc-spa's optional peer for packages/shadcn-theme.
overrides:
    '@tanstack/react-start': ^1.168.60
    '@tanstack/start-server-core': ^1.169.39
    # keycloakify-emails pins esbuild ^0.24 (= 0.24.x only), which rejects the `#/…` subpath
    # imports declared in packages/shadcn-theme/package.json; esbuild >= 0.27 supports them.
    'keycloakify-emails>esbuild': ^0.28.1
