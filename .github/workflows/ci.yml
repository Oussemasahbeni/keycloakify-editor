name: CI/CD

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

env:
    NODE_VERSION: "24"

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"

            - run: pnpm install --frozen-lockfile
            - run: pnpm theme:build-keycloak-theme
            - run: pnpm fmt:check
            - run: pnpm theme:lint
            - run: pnpm editor:lint
            - run: pnpm editor:test
            - run: pnpm editor:build

    security_scan:
        name: Security Scan (Trivy)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  hide-progress: false
                  format: "table"
                  exit-code: "1"
                  severity: "CRITICAL,HIGH"
                  ignore-unfixed: true

    check_if_version_upgraded:
        name: Check if version upgraded
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        needs: test
        outputs:
            from_version: ${{ steps.step1.outputs.from_version }}
            to_version: ${{ steps.step1.outputs.to_version }}
            is_upgraded_version: ${{ steps.step1.outputs.is_upgraded_version }}
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 2
            - id: step1
              shell: bash
              run: |
                  PKG=packages/shadcn-theme/package.json
                  TO=$(node -p "require('./$PKG').version")
                  if git show HEAD~1:$PKG > /tmp/old.json 2>/dev/null; then
                    FROM=$(node -p "require('/tmp/old.json').version")
                  else
                    FROM="0.0.0"
                  fi
                  echo "from_version=$FROM" >> "$GITHUB_OUTPUT"
                  echo "to_version=$TO"     >> "$GITHUB_OUTPUT"
                  if [ "$TO" != "$FROM" ] && \
                     [ "$(printf '%s\n%s\n' "$FROM" "$TO" | sort -V | tail -n1)" = "$TO" ]; then
                    echo "is_upgraded_version=true"  >> "$GITHUB_OUTPUT"
                  else
                    echo "is_upgraded_version=false" >> "$GITHUB_OUTPUT"
                  fi

    create_github_release:
        runs-on: ubuntu-latest
        needs: [check_if_version_upgraded, security_scan]
        if: needs.check_if_version_upgraded.outputs.is_upgraded_version == 'true'
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"

            - run: pnpm install --frozen-lockfile
            - run: pnpm theme:build-keycloak-theme

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  name: Release v${{ needs.check_if_version_upgraded.outputs.to_version }}
                  tag_name: v${{ needs.check_if_version_upgraded.outputs.to_version }}
                  target_commitish: ${{ github.ref }}
                  generate_release_notes: true
                  draft: false
                  files: packages/shadcn-theme/dist_keycloak/*.jar

    gh_pages:
        runs-on: ubuntu-latest
        needs: create_github_release
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"

            - run: pnpm install --frozen-lockfile
            - run: pnpm theme:build-storybook

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: packages/shadcn-theme/storybook-static

    deploy_gh_pages:
        needs: gh_pages
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

    publish_to_npm:
        runs-on: ubuntu-latest
        needs: [check_if_version_upgraded, security_scan]
        if: needs.check_if_version_upgraded.outputs.is_upgraded_version == 'true'
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  registry-url: "https://registry.npmjs.org"

            - run: pnpm install --frozen-lockfile

            - name: Prepare NPM Package
              run: pnpm theme:prepare

            - name: Publish to NPM
              run: |
                  cd packages/shadcn-theme/keycloak-theme_to_publish
                  npm publish --access public --provenance
